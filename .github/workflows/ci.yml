name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest and CSS
        run: node scripts/check-css.js
      - name: Check JavaScript syntax
        run: for file in js/*.js options/*.js; do node --check "$file"; done