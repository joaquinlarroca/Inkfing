<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>InkFing Options Page</title>
        <link rel="stylesheet" href="../css/root.css" />
        <link rel="stylesheet" href="./options.css" />
    </head>

    <body>
        <p>
            useExperimental: <b id="managed-useExperimental">-</b>, quality:
            <b id="managed-quality">-</b>
            <a id="storage" title="Chrome local storage usage">-</a>
        </p>
        <form>
            <label for="useExperimental">Use experimental features?</label>
            <input type="checkbox" id="useExperimental" />
            <br />
            <label for="quality">Quality For Processed Images</label>
            <input type="number" id="quality" max="4" min="1" step=".1" />
            <br />
            <button type="submit">Save</button>
        </form>
        <button type="button" id="reload">Reload</button>
        <button type="button" id="clear-eva">Clear EVA Images</button>
        <button type="button" id="clear-login">Clear login Images</button>
        <button type="button" id="rls">Reset Local Storage</button>
        <script src="options.js"></script>
    </body>
</html>
